<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f1b2d">
    <title>You are offline</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f4f6fa; color: #111827; }
        .box { max-width: 380px; text-align: center; background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 32px 24px; }
        .mark { width: 56px; height: 56px; border-radius: 14px; background: #0f1b2d; color: #fff; display: grid; place-items: center; margin: 0 auto 16px; font-size: 28px; }
        h1 { font-size: 1.4rem; margin: 0 0 8px; }
        p { color: #6b7280; margin: 0 0 20px; line-height: 1.5; }
        button { min-height: 44px; padding: 8px 22px; border: 0; border-radius: 10px; background: #2563eb; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <div class="mark">&#127974;</div>
        <h1>You are offline</h1>
        <p>Apex Core Banking needs an internet connection to show your accounts. Your information is not stored on this device. Check your connection and try again.</p>
        <button type="button" onclick="location.reload()">Retry</button>
    </div>
</body>
</html>
