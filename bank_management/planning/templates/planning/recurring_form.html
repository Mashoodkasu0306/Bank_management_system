{% extends "base.html" %}
{% block title %}New recurring payment{% endblock %}
{% block content %}
<div class="page-head"><h2>New recurring payment</h2></div>
<p class="muted">This saves the schedule only. No money moves until a payment falls due.</p>

<form method="POST" class="form-card">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="row-actions">
        <button type="submit" class="btn btn-primary">Save recurring payment</button>
        <a class="btn" href="{% url 'my_recurring' %}">Cancel</a>
    </div>
</form>
{% endblock %}
