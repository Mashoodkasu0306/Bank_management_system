{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-card">
    <h2>Login</h2>
    <p class="muted">Sign in to your Apex Core Banking account.</p>
    <form method="POST">
        {% csrf_token %}
        <div class="field"><label for="id_username">Username</label><input type="text" id="id_username" name="username" placeholder="Username" autocomplete="username" autofocus required></div>
        <div class="field"><label for="id_password">Password</label><input type="password" id="id_password" name="password" placeholder="Password" autocomplete="current-password" required></div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
</div>
{% endblock %}
