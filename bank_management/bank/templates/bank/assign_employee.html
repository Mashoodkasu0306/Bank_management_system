{% extends "base.html" %}
{% block title %}Assign Employee to Branch{% endblock %}
{% block content %}
<div class="page-head"><h2>Assign Employee to Branch</h2></div>

<form method="POST" class="form-card">
    {% csrf_token %}
    <div class="field">
        <label for="id_employee">Unassigned Employee</label>
        <select id="id_employee" name="employee" required>
            <option value="">-- Select Employee --</option>
            {% for emp in employees %}
            <option value="{{ emp.id }}">{{ emp.user.username }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="field">
        <label for="id_branch">Branch</label>
        <select id="id_branch" name="branch" required>
            <option value="">-- Select Branch --</option>
            {% for branch in branches %}
            <option value="{{ branch.id }}">{{ branch.name }} ({{ branch.branch_code }})</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Assign</button>
</form>
{% endblock %}
