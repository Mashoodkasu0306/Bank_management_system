{% extends "base.html" %}
{% block title %}Create Bank{% endblock %}
{% block content %}
<div class="page-head">
    <h2>Create Bank</h2>
    <a class="btn" href="{% url 'bank_list' %}">View All Banks</a>
</div>

<form method="POST" class="form-card">
    {% csrf_token %}
    <div class="field"><label for="id_name">Bank Name</label><input type="text" id="id_name" name="name" required></div>
    <div class="field"><label for="id_code">Bank Code</label><input type="text" id="id_code" name="code" required></div>
    <div class="field"><label for="id_head_office_address">Head Office Address</label><textarea id="id_head_office_address" name="head_office_address" rows="3"></textarea></div>
    <div class="field"><label for="id_contact_email">Contact Email</label><input type="email" id="id_contact_email" name="contact_email"></div>
    <div class="field"><label for="id_contact_phone">Contact Phone</label><input type="text" id="id_contact_phone" name="contact_phone"></div>
    <button type="submit" class="btn btn-primary btn-block">Create Bank</button>
</form>
{% endblock %}
