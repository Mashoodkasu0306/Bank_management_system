{% extends "base.html" %}
{% block title %}Create Branch{% endblock %}
{% block content %}
<div class="page-head">
    <h2>Create Branch</h2>
    <a class="btn" href="{% url 'branch_list' %}">View All Branches</a>
</div>

<form method="POST" class="form-card">
    {% csrf_token %}
    <div class="field">
        <label for="id_bank">Bank</label>
        <select id="id_bank" name="bank" required>
            <option value="">-- Select Bank --</option>
            {% for bank in banks %}
            <option value="{{ bank.id }}">{{ bank.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="field"><label for="id_name">Branch Name</label><input type="text" id="id_name" name="name" required></div>
    <div class="field"><label for="id_branch_code">Branch Code</label><input type="text" id="id_branch_code" name="branch_code" required></div>
    <div class="field"><label for="id_address">Address</label><textarea id="id_address" name="address" rows="3" required></textarea></div>
    <div class="field"><label for="id_city">City</label><input type="text" id="id_city" name="city" required></div>
    <div class="field"><label for="id_state">State</label><input type="text" id="id_state" name="state" required></div>
    <div class="field"><label for="id_ifsc_code">IFSC Code</label><input type="text" id="id_ifsc_code" name="ifsc_code" required></div>
    <div class="field"><label for="id_contact_phone">Contact Phone</label><input type="text" id="id_contact_phone" name="contact_phone"></div>
    <button type="submit" class="btn btn-primary btn-block">Create Branch</button>
</form>
{% endblock %}
