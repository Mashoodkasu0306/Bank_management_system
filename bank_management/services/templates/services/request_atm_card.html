{% extends "base.html" %}
{% block content %}
<h2>Request ATM Card</h2>

{% if not accounts %}
<p>You have no eligible active Savings/Current accounts to request an ATM card for.</p>
{% else %}
<form method="post">
    {% csrf_token %}
    <p>
        <label>Select Account:</label>
        <select name="account" required>
            <option value="">-- Select --</option>
            {% for account in accounts %}
            <option value="{{ account.id }}">{{ account.account_no }} ({{ account.get_account_type_display }}) -
                Balance: {{ account.balance }}</option>
            {% endfor %}
        </select>
    </p>
    {{ form.as_p }}
    <button type="submit">Submit Request</button>
</form>
{% endif %}

<p><a href="{% url 'my_atm_cards' %}">View My ATM Card Requests</a></p>
<p><a href="{% url 'customer_dashboard' %}">Back to Dashboard</a></p>
{% endblock %}
