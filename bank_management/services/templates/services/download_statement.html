{% extends "base.html" %}
{% block content %}
<h2>Download Account Statement</h2>
<p>Account: {{ account.account_no }} ({{ account.get_account_type_display }})</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Download PDF</button>
</form>

<p><a href="{% url 'customer_dashboard' %}">Back to Dashboard</a></p>
{% endblock %}
