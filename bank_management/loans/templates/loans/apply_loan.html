{% extends "base.html" %}
{% block title %}Apply for a Loan{% endblock %}
{% block content %}
<div class="page-head"><h2>Apply for a Loan</h2></div>
<form method="post" enctype="multipart/form-data" class="form-card">
    {% csrf_token %}
    <div class="field">
        <label for="id_loan_type">Loan Type:</label>
        <select name="loan_type" id="id_loan_type" required>
            <option value="HOME">Home Loan</option>
            <option value="PERSONAL">Personal Loan</option>
            <option value="CAR">Car Loan</option>
        </select>
    </div>
    <div class="field">
        <label for="id_repayment_type">Repayment Type:</label>
        <select name="repayment_type" id="id_repayment_type" required>
            <option value="EMI">EMI (Fixed Monthly Installments)</option>
            <option value="LUMP_SUM">Lump Sum (Pay Any Amount, Any Time)</option>
        </select>
    </div>
    <div class="field"><label for="id_amount">Amount:</label><input type="number" step="0.01" id="id_amount" name="amount" required></div>
    <div class="field"><label for="id_tenure">Tenure (months):</label><input type="number" id="id_tenure" name="tenure_months" required></div>
    <div class="field">
        <label for="id_account">Disbursement Account:</label>
        <select name="account" id="id_account" required>
            <option value="">Select Account</option>
            {% for account in accounts %}
            <option value="{{ account.id }}">{{ account.account_no }} ({{ account.get_account_type_display }})</option>
            {% endfor %}
        </select>
    </div>
    <div class="field">
        <label for="id_document_type">Supporting Document (optional, PDF/JPG/PNG, max 5MB):</label>
        <select name="document_type" id="id_document_type">
            <option value="ID_PROOF">ID Proof</option>
            <option value="INCOME_PROOF">Income Proof</option>
            <option value="ADDRESS_PROOF">Address Proof</option>
            <option value="OTHER">Other</option>
        </select>
    </div>
    <div class="field"><input type="file" name="document"></div>
    <button type="submit" class="btn btn-primary btn-block">Submit Application</button>
</form>
{% endblock %}
