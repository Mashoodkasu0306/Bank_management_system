{% extends "base.html" %}
{% block content %}
<h2>Apply for a Loan</h2>
{% if messages %}
{% for message in messages %}
<p style="color:{% if message.tags == 'error' %}red{% else %}green{% endif %};">{{ message }}</p>
{% endfor %}
{% endif %}
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <label>Loan Type:</label>
    <select name="loan_type" required>
        <option value="HOME">Home Loan</option>
        <option value="PERSONAL">Personal Loan</option>
        <option value="CAR">Car Loan</option>
    </select><br><br>

    <label>Repayment Type:</label>
    <select name="repayment_type" required>
        <option value="EMI">EMI (Fixed Monthly Installments)</option>
        <option value="LUMP_SUM">Lump Sum (Pay Any Amount, Any Time)</option>
    </select><br><br>

    <label>Amount:</label>
    <input type="number" step="0.01" name="amount" required><br><br>

    <label>Tenure (months):</label>
    <input type="number" name="tenure_months" required><br><br>

    <label>Disbursement Account:</label>
    <select name="account" required>
        <option value="">Select Account</option>
        {% for account in accounts %}
        <option value="{{ account.id }}">{{ account.account_no }} ({{ account.get_account_type_display }})</option>
        {% endfor %}
    </select><br><br>

    <label>Supporting Document (optional, PDF/JPG/PNG, max 5MB):</label><br>
    <select name="document_type">
        <option value="ID_PROOF">ID Proof</option>
        <option value="INCOME_PROOF">Income Proof</option>
        <option value="ADDRESS_PROOF">Address Proof</option>
        <option value="OTHER">Other</option>
    </select>
    <input type="file" name="document"><br><br>

    <button type="submit">Submit Application</button>
</form>
{% endblock %}
