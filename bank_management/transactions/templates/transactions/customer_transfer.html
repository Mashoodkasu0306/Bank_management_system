{% extends "base.html" %}
{% block content %}
<h2>Transfer Money</h2>

{% if messages %}
{% for message in messages %}
<p style="color:{% if message.tags == 'error' %}red{% else %}green{% endif %};">{{ message }}</p>
{% endfor %}
{% endif %}

<form method="POST">
    {% csrf_token %}
    <label>From Account</label><br>
    <select name="from_account_no" required>
        <option value="">Select your account</option>
        {% for account in accounts %}
        <option value="{{ account.account_no }}">{{ account.account_no }} — {{ account.get_account_type_display }}
            (Balance: {{ account.balance }})</option>
        {% endfor %}
    </select><br><br>

    <label>To Account Number</label><br>
    <input type="text" name="to_account_no" required><br><br>

    <label>Amount</label><br>
    <input type="number" step="0.01" name="amount" required><br><br>

    <label>Mode of Transaction</label><br>
    <select name="mode_of_transaction">
        <option value="NETBANKING">Net Banking</option>
        <option value="UPI">UPI</option>
        <option value="CARD">Card</option>
    </select><br><br>

    <button type="submit">Transfer</button>
</form>
{% endblock %}
