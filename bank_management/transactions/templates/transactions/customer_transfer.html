{% extends "base.html" %}
{% block title %}Transfer Money{% endblock %}
{% block content %}
<div class="page-head">
    <h2>Transfer Money</h2>
</div>

<form method="POST" class="form-card">
    {% csrf_token %}
    <div class="field">
        <label for="id_from_account_no">From Account</label>
        <select id="id_from_account_no" name="from_account_no" required>
            <option value="">Select your account</option>
            {% for account in accounts %}
            <option value="{{ account.account_no }}">{{ account.account_no }} - {{ account.get_account_type_display }} (Balance: {{ account.balance }})</option>
            {% endfor %}
        </select>
    </div>

    <div class="field">
        <label for="id_to_account_no">To Account Number</label>
        <input type="text" id="id_to_account_no" name="to_account_no" required>
    </div>

    <div class="field">
        <label for="id_amount">Amount</label>
        <input type="number" step="0.01" id="id_amount" name="amount" required>
    </div>

    <div class="field">
        <label for="id_category">Category (what is this payment for?)</label>
        <select id="id_category" name="category">
            {% for value, label in categories %}
            <option value="{{ value }}" {% if value == "OTHER" %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="field">
        <label for="id_mode">Mode of Transaction</label>
        <select id="id_mode" name="mode_of_transaction">
            <option value="NETBANKING">Net Banking</option>
        </select>
    </div>

    <button type="submit" class="btn btn-primary btn-block">Transfer</button>
</form>
{% endblock %}
