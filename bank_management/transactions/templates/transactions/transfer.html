{% extends "base.html" %}
{% block title %}Transfer Money{% endblock %}
{% block content %}
<div class="page-head"><h2>Transfer Money</h2></div>
<form method="POST" class="form-card">
    {% csrf_token %}
    <div class="field"><label for="id_from">From Account Number</label><input type="text" id="id_from" name="from_account_no" required></div>
    <div class="field"><label for="id_to">To Account Number</label><input type="text" id="id_to" name="to_account_no" required></div>
    <div class="field"><label for="id_amount">Amount</label><input type="number" step="0.01" id="id_amount" name="amount" required></div>
    <div class="field">
        <label for="id_mode">Mode of Transaction</label>
        <select id="id_mode" name="mode_of_transaction">
            <option value="NETBANKING">Net Banking</option>
            <option value="UPI">UPI</option>
            <option value="CASH">Cash</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Transfer</button>
</form>
{% endblock %}
